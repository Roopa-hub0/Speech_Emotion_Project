<!DOCTYPE html>

<html>

<head>

```
<title>Prediction History</title>

<style>

    body{
        font-family:'Segoe UI',sans-serif;
        background:linear-gradient(135deg,#667eea,#764ba2);
        min-height:100vh;
        margin:0;
        padding:0;
        text-align:center;
        color:white;
    }

    /* Navbar */

    .navbar{
        background:rgba(0,0,0,0.2);
        backdrop-filter:blur(10px);
        padding:15px;
    }

    .navbar a{
        color:white;
        text-decoration:none;
        margin:0 20px;
        font-size:18px;
        font-weight:bold;
    }

    .navbar a:hover{
        color:#ffd700;
    }

    /* Page Title */

    .page-title{
        margin-top:30px;
        color:white;
    }

    /* Table Container */

    .table-container{

        width:90%;

        margin:30px auto;

        background:rgba(255,255,255,0.15);

        backdrop-filter:blur(15px);

        border-radius:20px;

        padding:25px;

        border:1px solid rgba(255,255,255,0.2);

        box-shadow:0 8px 32px rgba(0,0,0,0.2);

        overflow-x:auto;
    }

    table{
        width:100%;
        border-collapse:collapse;
        background:white;
        color:#333;
        border-radius:10px;
        overflow:hidden;
    }

    th, td{
        padding:15px;
        text-align:center;
        border-bottom:1px solid #ddd;
    }

    th{
        background:#2c3e50;
        color:white;
        font-size:16px;
    }

    tr:nth-child(even){
        background:#f5f5f5;
    }

    tr:hover{
        background:#e8f0ff;
    }

    /* Footer */

    footer{
        margin-top:20px;
        padding:20px;
        color:white;
    }

</style>
```

</head>

<body>

```
<!-- Navbar -->

<div class="navbar">
    <a href="/">🏠 Home</a>
    <a href="/history">📜 History</a>
    <a href="/dashboard">📊 Dashboard</a>
    <a href="/download">📥 Download</a>
</div>

<h1 class="page-title">
    📜 Prediction History
</h1>

<div class="table-container">

    <table>

        <tr>
            {% for col in columns %}
            <th>{{ col }}</th>
            {% endfor %}
        </tr>

        {% for row in tables %}
        <tr>

            {% for cell in row %}
            <td>{{ cell }}</td>
            {% endfor %}

        </tr>
        {% endfor %}

    </table>

</div>

<footer>
    <p>Developed by Roopa Ramthapure</p>
</footer>
```

</body>

</html>
